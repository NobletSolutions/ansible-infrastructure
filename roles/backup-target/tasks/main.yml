---
- name: Error if we haven't configured backup_target_master_host
  fail: msg="backup_target_master_host OR backup_target_master_ssh_pubkey is not set"
  when: backup_target_master_host == False or backup_target_master_ssh_pubkey == False

- name: Install required packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: installed
  with_items:
    - rsync
    - sudo

- name: Add backup system user
  ansible.builtin.user:
    name: "{{ backup_target_user }}"
    shell: /bin/bash
    update_password: on_create
    password_expire_max: -1

- name: Create user .ssh directory
  ansible.builtin.file:
    path: "/home/{{backup_target_user}}/.ssh/"
    mode: '0700'
    setype: ssh_home_t
    state: directory

- name: Generate backup user ssh key pair
  community.crypto.openssh_keypair:
    path: "/home/{{backup_target_user}}/.ssh/id_ed25519"
    type: ed25519

- name: Sudo configuration for the backup system user
  ansible.builtin.template: src=sudo.j2 dest="/etc/sudoers.d/{{ backup_target_user }}" owner=root group=root mode=0440

- name: Ensure requiretty is off
  ansible.builtin.lineinfile: dest=/etc/sudoers state=absent regexp="^Defaults    requiretty"

- name: Install the 'rsync-wrapper.sh' script, called by the master
  ansible.builtin.copy:
    src: rsync-wrapper.sh
    dest: /usr/local/bin/rsync-wrapper.sh
    owner: root
    group: "{{ backup_target_user }}"
    mode: 0755

- name: Set the SSH public key for the backup system user
  authorized_key:
    user: "{{ backup_target_user }}"
    key: "{{ backup_target_master_ssh_pubkey }}"
  notify:
    - update aide
