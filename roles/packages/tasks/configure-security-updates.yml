---
- name: Create DNF security update service
  ansible.builtin.template:
    src: dnf-security-update.service.j2
    dest: "/etc/systemd/system/dnf-security-update.service"
    owner: root
    group: root
    mode: 0644

- name: Create DNF security update timer
  ansible.builtin.template:
    src: dnf-security-update.timer.j2
    dest: "/etc/systemd/system/dnf-security-update.timer"
    owner: root
    group: root
    mode: 0644

- name: Reload systemd daemon
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Enable security update timer
  ansible.builtin.systemd_service:
    name: dnf-security-update.timer
    enabled: true
    state: started